<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Neon Pulse Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.4" stroke-dasharray="16 12" />

  <!-- Shield Shape -->
  <path d="M 256 90 L 375 145 C 375 270 256 365 256 395 C 256 365 137 270 137 145 Z" 
        fill="url(#shieldGrad)" stroke="url(#accentGrad)" stroke-width="8" filter="url(#glow)" />

  <!-- Android Robot Head Silhouette Elements Inside Shield -->
  <path d="M 205 185 A 51 51 0 0 1 307 185 Z" fill="#10B981" opacity="0.9" />
  <!-- Antennas -->
  <line x1="220" y1="165" x2="205" y2="145" stroke="#10B981" stroke-width="6" stroke-linecap="round" />
  <line x1="292" y1="165" x2="307" y2="145" stroke="#10B981" stroke-width="6" stroke-linecap="round" />
  <!-- Robot eyes -->
  <circle cx="230" cy="180" r="5" fill="#0F172A" />
  <circle cx="282" cy="180" r="5" fill="#0F172A" />

  <!-- Center Lock & Timer Dial -->
  <!-- Timer Arc -->
  <circle cx="256" cy="275" r="55" fill="#1E293B" stroke="#334155" stroke-width="8" />
  <path d="M 256 220 A 55 55 0 0 1 311 275" fill="none" stroke="#06B6D4" stroke-width="8" stroke-linecap="round" />
  
  <!-- Padlock Shackle -->
  <path d="M 238 265 V 248 C 238 238 274 238 274 248 V 265" fill="none" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round" />
  <!-- Padlock Body -->
  <rect x="230" y="265" width="52" height="40" rx="8" fill="url(#accentGrad)" />
  <!-- Keyhole -->
  <circle cx="256" cy="281" r="4" fill="#0F172A" />
  <path d="M 254 283 L 258 283 L 257 294 L 255 294 Z" fill="#0F172A" />

  <!-- Hourglass / Timer Tick Marks -->
  <circle cx="256" cy="225" r="3" fill="#10B981" />
  <circle cx="306" cy="275" r="3" fill="#10B981" />
  <circle cx="256" cy="325" r="3" fill="#64748B" />
  <circle cx="206" cy="275" r="3" fill="#64748B" />
</svg>
